# Stop needrestart from auto-restarting the Minecraft server after library/Java updates.
# Dozer alerts instead, and you restart gracefully with `restart mc`.
# Install: sudo cp /home/sleepy/dozer/deploy/needrestart-eugh.conf /etc/needrestart/conf.d/50-eugh.conf
$nrconf{override_rc}{qr(^eugh\.service$)} = 0;
