# systemd drop-in: stop the Minecraft server via RCON instead of the screen console.
# Install:
#   sudo mkdir -p /etc/systemd/system/eugh.service.d
#   sudo cp /home/sleepy/dozer/deploy/eugh-rcon-stop.conf /etc/systemd/system/eugh.service.d/rcon-stop.conf
#   sudo systemctl daemon-reload
[Service]
ExecStop=
ExecStop=/home/sleepy/dozer/venv/bin/python /home/sleepy/dozer/deploy/mc_stop.py
TimeoutStopSec=100
