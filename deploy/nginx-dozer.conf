# dozer.isaac-dev.eu — phone app API for Dozer (voice). Only /api/ is exposed; /hooks/ stays internal.
# Install:
#   sudo cp /home/sleepy/dozer/deploy/nginx-dozer.conf /etc/nginx/sites-available/dozer.isaac-dev.eu
#   sudo ln -s /etc/nginx/sites-available/dozer.isaac-dev.eu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dozer.isaac-dev.eu
limit_req_zone $binary_remote_addr zone=dozer_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dozer.isaac-dev.eu;

    client_max_body_size 9m;
    access_log /var/log/nginx/dozer.access.log;

    location /api/ {
        limit_req zone=dozer_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 240s;     # first brain request after a cold start can take ~1–3 min
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
